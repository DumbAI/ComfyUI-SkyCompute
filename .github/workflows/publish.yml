name: Publish to Comfy Registry
# Manual: bump `version` in pyproject.toml first. Needs the REGISTRY_ACCESS_TOKEN
# secret, a publishing key of the registry's `dumbai` publisher.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'DumbAI'
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
